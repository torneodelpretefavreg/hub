<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub · Davide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110e;
    --bg-2:#1c1813;
    --card:#211c16;
    --card-hover:#2a241c;
    --line:#352e24;
    --text:#f3ece1;
    --muted:#a4988440;
    --muted-text:#9a8d77;
    --accent:#e8a33d;
    --accent-soft:#e8a33d22;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 85% -10%, #e8a33d14, transparent 60%),
      radial-gradient(700px 500px at -10% 110%, #e8a33d0d, transparent 55%);
    background-attachment:fixed;
  }
  /* sottile texture a puntini per dare profondità */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background-image:radial-gradient(var(--muted) .5px, transparent .5px);
    background-size:22px 22px;
    mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 80%);
  }
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:64px 28px 96px}

  header{margin-bottom:44px}
  .kicker{
    font-size:12px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:14px;
    opacity:0;animation:rise .7s .05s forwards;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:clamp(2.6rem,6vw,4.4rem);line-height:1;letter-spacing:-.02em;
    opacity:0;animation:rise .7s .12s forwards;
  }
  h1 em{font-style:italic;color:var(--accent)}
  .sub{
    margin-top:16px;color:var(--muted-text);font-size:1.02rem;max-width:46ch;
    opacity:0;animation:rise .7s .2s forwards;
  }

  .toolbar{
    margin:36px 0 30px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    opacity:0;animation:rise .7s .28s forwards;
  }
  .search{position:relative;flex:1;min-width:240px}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}
  .search input{
    width:100%;background:var(--bg-2);border:1px solid var(--line);
    color:var(--text);font-family:inherit;font-size:.98rem;
    padding:14px 16px 14px 46px;border-radius:14px;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .search input::placeholder{color:var(--muted-text)}
  .count{font-size:.85rem;color:var(--muted-text);white-space:nowrap}

  .group-title{
    font-family:'Fraunces',serif;font-size:1.05rem;color:var(--muted-text);
    letter-spacing:.04em;margin:34px 0 16px;display:flex;align-items:center;gap:14px;
  }
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

  .card{
    position:relative;display:flex;flex-direction:column;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, background .25s;
    opacity:0;transform:translateY(14px);animation:rise .6s forwards;
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%), var(--accent-soft), transparent 60%);
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  .card:hover{transform:translateY(-4px);border-color:#5a4e3c;background:var(--card-hover)}
  .card:hover::after{opacity:1}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .icon{
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-size:1.5rem;background:var(--bg-2);border:1px solid var(--line);flex-shrink:0;
  }
  .arrow{opacity:.4;transition:transform .25s, opacity .25s;margin-top:4px}
  .card:hover .arrow{opacity:1;transform:translate(3px,-3px)}
  .card h3{font-size:1.18rem;font-weight:600;letter-spacing:-.01em}
  .card p{color:var(--muted-text);font-size:.92rem;line-height:1.5}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .tag{
    font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
    color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:7px;
  }
  /* stato "link da impostare" */
  .card.todo{opacity:.62}
  .card.todo .icon{filter:grayscale(1)}
  .card.todo .arrow{display:none}
  .tag.warn{color:#e8a33d;background:transparent;border:1px dashed #5a4e3c}
  .tag.lock{color:var(--muted-text);background:transparent;border:1px solid var(--line)}

  .empty{text-align:center;color:var(--muted-text);padding:60px 20px;font-size:1.05rem;display:none}

  footer{
    margin-top:60px;text-align:center;color:var(--muted-text);font-size:.82rem;
    border-top:1px solid var(--line);padding-top:26px;
  }
  footer kbd{
    font-family:'Manrope';font-size:.72rem;background:var(--bg-2);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--text);
  }

  @keyframes rise{to{opacity:1;transform:none}}
  @media (max-width:520px){.wrap{padding:44px 20px 70px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Centro di comando</div>
    <h1>I tuoi <em>programmi</em>,<br>in un posto solo.</h1>
    <p class="sub">Un punto di partenza per raggiungere ogni applicazione. Cerca, clicca, sei dentro.</p>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Cerca un programma…  (premi  /  )" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="board"></div>
  <div class="empty" id="empty">Nessun programma trovato.</div>

  <footer>
    Hub personale · per aggiungere un programma modifica la lista <kbd>APPS</kbd> all'inizio del file
  </footer>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   I TUOI PROGRAMMI  —  modifica solo questa lista.

   Per aggiungerne uno nuovo, copia un blocco { ... } e cambia i campi:
     icon     → un'emoji (o lascia "")
     name     → nome del programma
     desc     → breve descrizione
     url      → il link.  Lascia "#" finché non hai l'indirizzo:
                la card resterà segnata come "da impostare".
     tags     → etichette, es: ["Contabilità","Firebase"]
     group    → categoria con cui raggrupparlo (es. "Futsal Fabbrico")
   ════════════════════════════════════════════════════════════════════ */
const APPS = [
  {
    icon:"⚽",
    name:"Sito Futsal Fabbrico",
    desc:"Sito ufficiale: squadra, stagione, risultati e Torneo del Prete.",
    url:"https://torneodelpretefavreg.github.io/tdp/",
    tags:["Sito","Pubblico"],
    group:"Futsal Fabbrico ASD"
  },
  {
    icon:"📒",
    name:"Contabilità Futsal Fabbrico",
    desc:"Gestionale di partita doppia: piano dei conti, bilancio, cespiti e report.",
    url:"https://torneodelpretefavreg.github.io/contabilit-/",
    tags:["Contabilità","Firebase"],
    group:"Futsal Fabbrico ASD",
    locked:true
  },
  {
    icon:"🗂️",
    name:"TdP Manager",
    desc:"Gestione del torneo: squadre, calendario e organizzazione dell'evento.",
    url:"https://torneodelpretefavreg.github.io/master/",
    tags:["Gestione"],
    group:"Torneo del Prete",
    locked:true
  },
  {
    icon:"💶",
    name:"CassaPro",
    desc:"Cassa POS mobile per il Torneo del Prete, con sincronizzazione e scontrini.",
    url:"https://torneodelpretefavreg.github.io/cassapro/",
    tags:["POS","Eventi"],
    group:"Torneo del Prete",
    locked:true
  },
  // ── nuovo programma: copia il blocco qui sotto ──
  // {
  //   icon:"🚀",
  //   name:"Nome programma",
  //   desc:"Cosa fa, in una riga.",
  //   url:"https://…",
  //   tags:["Etichetta"],
  //   group:"Generale",
  //   locked:false        // metti true se richiede un codice d'accesso
  // },
];
/* ════════════════════════════════════════════════════════════════════ */

const board = document.getElementById('board');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');

function buildCard(app, i){
  const todo = !app.url || app.url === "#";
  const a = document.createElement('a');
  a.className = 'card' + (todo ? ' todo' : '');
  a.href = todo ? 'javascript:void(0)' : app.url;
  if(!todo){ a.target = '_blank'; a.rel = 'noopener'; }
  a.style.animationDelay = (0.34 + i * 0.05) + 's';

  const tags = (app.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const lock = app.locked ? `<span class="tag lock">🔒 codice</span>` : '';
  const warn = todo ? `<span class="tag warn">da impostare</span>` : '';

  a.innerHTML = `
    <div class="card-top">
      <div class="icon">${app.icon || "▦"}</div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </div>
    <h3>${app.name}</h3>
    <p>${app.desc || ""}</p>
    <div class="tags">${tags}${lock}${warn}</div>`;

  a.addEventListener('mousemove', e => {
    const r = a.getBoundingClientRect();
    a.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    a.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  return a;
}

function render(filter = ""){
  board.innerHTML = "";
  const q = filter.trim().toLowerCase();
  const list = APPS.filter(app => {
    const hay = (app.name + " " + (app.desc||"") + " " + (app.tags||[]).join(" ") + " " + (app.group||"")).toLowerCase();
    return hay.includes(q);
  });

  count.textContent = list.length + (list.length === 1 ? " programma" : " programmi");
  empty.style.display = list.length ? "none" : "block";

  // raggruppa per "group"
  const groups = {};
  list.forEach(app => { const g = app.group || "Generale"; (groups[g] = groups[g] || []).push(app); });

  let idx = 0;
  Object.keys(groups).forEach(g => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g;
    board.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[g].forEach(app => grid.appendChild(buildCard(app, idx++)));
    board.appendChild(grid);
  });
}

search.addEventListener('input', e => render(e.target.value));

// scorciatoia "/" per saltare alla ricerca
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== search){ e.preventDefault(); search.focus(); }
  if(e.key === 'Escape'){ search.value = ''; render(); search.blur(); }
});

render();
</script>
</body>
</html>
